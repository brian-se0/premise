# Key text that looked wrong or unclear (notes for the key owners; not part of any score)
# 1. Strengthen and weaken keys: criterion 2 after a failed criterion 1. Every strengthen key in this set says "A
#    qualifying new fact whose bearing is not explained earns 1", but only some say what a non-qualifying fact earns
#    when it comes with a confident explanation. arg-0009, -0012, -0015, -0022, -0026 and -0027 strengthen rely on
#    rubric 1's "(a fact pointing the other way does not count)" and "not already stated in them" alone; arg-0014.weaken
#    says "Smaller growth does not weaken the argument; it confirms it" without a score. Under protocol §3's "Apply each
#    rubric criterion separately", a grader can give 1 for the explanation (str01, str06, str13, str14, wea03, wea11).
#    Suggested sentence: "A fact that is not new, points the other way or denies a premise earns 0, whatever the
#    explanation."
# 2. arg-0020.weaken: the direction rule ("the streak holders starting ahead, not behind") is only in difficulty_note,
#    which never reaches a grader. Nothing grader-visible says a starting gap with the streak holders behind earns 0
#    (wea11).
# 3. arg-0022.strengthen: the weaken key says "a fact suggesting only a smaller rise than Pell's ... does not weaken",
#    but the strengthen key has no mirror rule for a fact that only suggests a bigger rise, such as Ardley's population
#    (str07).
# 4. arg-0017.conclusion: "Saying that the study's finding cannot be trusted is the intermediate claim" does not cover
#    a blend such as "the study shouldn't be trusted as evidence for the bike lanes" (con08).
# 5. arg-0010.assumption: the "not entirely" scope is clear, but the key does not say how to read an unhedged
#    contrast, "the rise is because of X and not because of Y" (asm01).
# 6. arg-0011.flaw: "fail to guarantee" versus "the claimed likelihood" does not settle an answer that cites how often
