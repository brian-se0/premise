- id: str09
  task: arg-0026.strengthen
  holdout: false
  type: extra-explanation
  answer: >-
    Brannock's shops used to hand out unusually thick bags, and the town's last waste audit before the fee
    found that checkout bags made up more of the weight of household plastic rubbish than any other single
    item. If 80 percent fewer of them are going home, a big slice of that weight should be gone. The officer's
    argument really jumps from a count of bags to a weight of plastic, so a fact about weight is what it was
    missing. (Kind of surprising that 25 cents was enough to change people's habits that much.)
  gold: 2
  second: 2
  why: >-
    Criterion 1 met: a new fact that checkout bags were the largest single item, by weight, in household
    plastic, which makes a large share by weight likely. Criterion 2 met: it explains that cutting them
    sharply removes much of that weight. The remark about count versus weight and the aside about the fee
    neither add nor lose credit.
