- id: str01
  task: arg-0009.strengthen
  holdout: false
  type: confidently-wrong
  answer: >-
    At the seven branches that kept closing at 6, teenage borrowing stayed flat over the same year. Those
    branches work like a control group, so this shows it was the extra hours, not something else, that made
    the difference.
  gold: 0
  second: 0
  acceptable: [ 0, 1 ]
  settlement: >-
    Both scorers gave 0; the second scorer names 1 as defensible: under "apply each rubric criterion
    separately" a grader could credit the control-group explanation even though the fact is a restated
    premise.
  why: >-
    A restated premise offered as new: the stimulus already says teenage borrowing at the other seven branches
    held steady, and the accept text says the steady borrowing at other branches is not new, so criterion 1
    fails and the explanation has no new fact to explain.
- id: str02
  task: arg-0009.strengthen
  holdout: false
  type: reference-like
  answer: >-
    i think a good one would be that most of the extra books were checked out by teens who have jobs or sports
    after school and basically couldnt get to the library before 6. so the new hours are literally what let
    them borrow at all, which makes it way more likely the hours are what caused the jump.
  gold: 2
