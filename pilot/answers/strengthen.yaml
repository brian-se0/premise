  type: confidently-wrong
  answer: >-
    ardley has about twice as many people as pell. so if pell's market went up by a third, ardley's should go
    up even more since theres way more potential customers to come on thursday nights
  gold: 0
  second: 0
  acceptable: [ 0, 1 ]
  settlement: >-
    Both scorers gave 0; the second scorer names 1 as defensible: the key has no rule for a fact about the
    town's size, which a grader could count as a weak reason to expect a rise.
  why: >-
    A fact too weak to be material: Ardley's Saturday market already draws on the same population and has flat
    sales, and town size says nothing about whether Ardley has the after-work shoppers who made the move work
