- id: str03
  task: arg-0012.strengthen
  holdout: false
  type: partial
  answer: >-
    In the two years since the cameras went in, the city made no other safety changes on those eight streets:
    no new traffic lights, speed bumps, crosswalks or lower speed limits.
  gold: 1
  second: 1
  why: >-
    Criterion 1 met: no other safety work on those streets is a new fact that removes a rival the stimulus
