    the accept text says a qualifying fact whose bearing is not explained earns 1.
- id: str04
  task: arg-0012.strengthen
  holdout: false
  type: ambiguous
  answer: >-
    most of the drop was on the blocks right where the cameras are. on the parts of those same streets that
    are out of the cameras range, the number of crashes barely moved. i think that helps the council's case
  gold: 1
  second: 1
  acceptable: [ 1, 2 ]
  settlement: >-
    Both scorers gave 1 and both name 2 as defensible: the key does not say whether a bare "that helps the
    council's case" explains a fact whose bearing is nearly self-evident from the within-street contrast.
  why: >-
    Criterion 1 is clearly met (crashes fell where cameras operate, an accept example of mechanism evidence).
    Criterion 2 is the borderline: read strictly, "helps the council's case" only asserts support without
    saying why (no mention of drivers slowing for the cameras), giving 1; read charitably, the near-versus-
    out-of-range contrast carries the reasoning itself, giving 2. Gold 1 because the rubric asks the answer to
    explain why, and it does not.
- id: str05
  task: arg-0015.strengthen
  holdout: false
  type: valid-unlike-reference
  answer: >-
    Surveys on the four goat islands find plenty of live saltbush seed in the soil, and seedlings come up
    every spring, but the goats eat nearly all of them within a few weeks. So the shrub can still regrow
    there; what holds it back is the grazing, which is exactly what removing the goats would end.
  gold: 2
  second: 2
  why: >-
    Criterion 1 met: a new fact, consistent with the premises, showing the four islands have something to
    regrow from and that goats are what stops it (the accept's shared-conditions and surviving-seed kinds).
    Criterion 2 met: it explains that the obstacle is the grazing, so removing the goats makes recovery there
    more likely.
- id: str06
  task: arg-0015.strengthen
  holdout: false
  type: keyword-contradiction
  answer: >-
    On the three goat-free islands, the saltbush only started coming back about fifteen years after the goats
    were taken off, in the same year a replanting program started there. This ties the recovery to the goats'
    removal, so it makes it more likely that removing the goats from the other four would work too.
  gold: 0
  second: 0
  why: >-
    Criterion 1 fails: a long lag that ends when replanting began points the other way, suggesting replanting
    rather than the goats' removal drove the recovery, and the rubric says a fact pointing the other way does
    not count. Criterion 2 fails: the claim that it "ties the recovery to the goats' removal" reverses what
    the fact shows.
- id: str07
  task: arg-0022.strengthen
