- id: wea03
  task: arg-0014.weaken
  holdout: false
  type: keyword-contradiction
  answer: >-
    Since the evening hours started, monthly bookings have gone up by about half, from around 400 to 600. A
    smaller share of a bigger total can still be a bigger number: 9 percent of 600 is 54 missed appointments,
    compared with 15 percent of 400, which is 60. So the clinic is actually missing more appointments now than
    before, which weakens the director's conclusion.
  gold: 0
  second: 0
  why: >-
    It uses the key's idea (a lower share of a larger total) but its own figures show 54 missed against 60,
    fewer, and then claims more. Growth of a half is below two-thirds, and the accept text says "smaller
    growth does not weaken the argument; it confirms it", so neither criterion is met.
