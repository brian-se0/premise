- id: wea01
  task: arg-0012.weaken
  holdout: false
  type: reference-like
  answer: >-
    In the twelve months before the cameras went up, those eight streets had 66 injury crashes, when the five
    years before that had averaged about 40 a year. A year that far out of line usually isn't repeated, so the
    next two years would probably have come in well under 66 even with no cameras at all. A good chunk of the
    40 percent drop could just be those streets settling back toward their normal level.
  gold: 2
  second: 2
  why: >-
    Criterion 1: a new fact about the eight streets before installation (an unusual spike), consistent with
    every premise. Criterion 2: explains that a spike tends to fall back on its own, so much of the decline
    could have happened without the cameras; it needs no further fact about the period after installation.
