- id: wea05
  task: arg-0016.weaken
  holdout: false
  type: extra-explanation
  answer: >-
    When all forty components update at once they fight over the phone's processor and memory, and Corvane's
    own profiling shows each one runs about four times slower than it does alone. The map took about 0.3
    seconds by itself in the standard tests, so with everything running it would need around 1.2 seconds, and
    the screen isn't done until the map is. That's more than twice the limit even though every piece passed
    separately. This is the classic gap between unit tests and integration tests, which is why a lot of app
    teams also time the whole screen end to end before a release.
  gold: 2
  second: 2
  why: >-
    Criterion 1: a new fact (components slow each other down when run together; the map at 0.3 seconds alone
    is consistent with the premises) that gives real doubt the screen meets the rule. Criterion 2: shows the
    whole screen would take about 1.2 seconds even granting each part passed alone; the testing tangent
    neither adds nor costs credit.
