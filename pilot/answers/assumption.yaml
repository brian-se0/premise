- id: asm01
  task: arg-0010.assumption
  holdout: false
  type: ambiguous
  answer: >-
    i think it assumes the ratings went up because people were actually happier with the help they got, and
    not because the unhappy customers quit the chat before the end so they never got the survey
  gold: 1
  second: 1
  acceptable: [ 1, 2 ]
  settlement: >-
    Both scorers gave 1 and both name 2 as defensible: the key does not say how to read an unhedged "because
    X, not because Y", which can exclude any partial effect (too strong) or name the main explanation (bridge
    (a)).
  why: >-
    Criterion 1 is met (an unstated claim linking the rise to satisfaction via who answered). Read literally,
    "not because" denies any contribution from unhappy customers leaving, which the accept text says is
    stronger than needed (a partial effect would not undo the argument), so 1; read charitably as "not just
    because", it is bridge (a) and earns 2. Under either uniform reading of "because" one conjunct is too
    strong, so 1 is the better score.
- id: asm02
  task: arg-0010.assumption
  holdout: false
  type: extra-explanation
  answer: >-
    The head of support has to assume the jump from 3.6 to 4.3 isn't wholly a matter of who ended up answering
    the survey. The survey only reaches people who stay until the agent closes the chat, so if the script made
    frustrated customers give up and leave early, the ones left would rate higher even if nobody got better
    help. The argument survives as long as at least some of the rise is people actually being more satisfied.
    (Six months on each side seems like a fair window, so I don't think the time period is the problem.)
  gold: 2
  second: 2
  why: >-
    Bridge (a) from the accept text, stated as "not wholly" a change in who answered, so its denial leaves the
    rise with no support and it is no stronger than needed; both criteria met. The aside about the six-month
    window neither adds nor costs credit.
