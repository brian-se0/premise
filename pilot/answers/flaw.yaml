- id: fla09
  task: arg-0025.flaw
  holdout: false
  type: keyword-contradiction
  answer: >-
    The writer jumps from one inspection in ten finding a violation to one restaurant in ten having one. But
    each restaurant was inspected four times, so the same bad restaurant could account for several of the
    failed inspections, which means the real share of restaurants with a violation could be lower than one in
    ten.
  gold: 1
  second: 1
  why: >-
    Criterion 1 met: names the share of inspections and the conclusion about the share of restaurants.
    Criterion 2 not met: it uses the four-inspections point but draws the wrong direction; the accept text
    says an answer that the share of restaurants could be lower than one in ten "has the direction wrong ...
    so it does not say why the inference fails".
- id: fla10
  task: arg-0025.flaw
  holdout: false
  type: partial
  answer: >-
    i think theyre mixing up inspections and restaurants. 1 in 10 inspections found a violation but thats not
    the same as 1 in 10 restaurants since every restaurant got checked 4 times, so the two numbers dont have
    to be the same
  gold: 1
  second: 1
  why: >-
    Names the inference (criterion 1) and says only that the two shares need not match, never that the share
    of restaurants could be higher; the accept text says such an answer earns 1, so criterion 2 is not met.
- id: fla11
  task: arg-0020.flaw
  holdout: true
  type: partial
  answer: >-
    the ad says keeping a 100 day streak is what made people better speakers just because the streak people
    scored higher on the test. but maybe the streak people had just been using the app longer than the others
    so they had more time to learn
  gold: 1
  second: 1
  why: >-
    Criterion 1 met: names the streak holders' higher test scores and the conclusion that the streak made them
    better speakers. Criterion 2 not met: the only alternative offered, longer use of the app, is one the
    stimulus rules out (both groups had used the app for about a year), and the accept text says such an
    alternative does not earn the point.
- id: fla12
  task: arg-0020.flaw
  holdout: true
  type: valid-unlike-reference
  answer: >-
    The ad reads the streak holders' much higher speaking scores as proof that keeping a streak is what made
    them better. But something else could be behind both: users with a roommate or girlfriend who speaks
    Spanish, say, have a daily reason to open the app and also get lots of real conversation practice, which
    could explain the better speaking whether or not the streak itself did anything.
  gold: 2
  second: 2
  why: >-
    Criterion 1 met: names the higher speaking scores and the conclusion that the streak made them better.
    Criterion 2 met: offers, as a possibility, a third factor the stimulus leaves open (a Spanish speaker at
    home and informal practice outside the app), a route the accept text credits; it differs from the
    reference's starting-ability alternative.
