- id: fla14
  task: arg-0020.flaw
  holdout: true
  type: keyword-contradiction
  answer: >-
    The ad gets cause and effect backwards. It assumes the users who already spoke Spanish better were the
    ones who kept 100-day streaks, when really it's keeping the streak that made them score higher on the
    speaking test.
  gold: 0
  second: 0
