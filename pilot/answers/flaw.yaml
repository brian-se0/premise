- id: fla07
  task: arg-0021.flaw
  holdout: false
  type: extra-explanation
  answer: >-
    The policy says a grant is renewed only if attendance rose, so a rise is something the museum needs, not
    something that guarantees renewal. The director treats it as a guarantee, but nothing in the policy stops
    the council from refusing on other grounds, say budget cuts or a poor review. As an if-then, the policy is
    "renewed → attendance rose", and the director is reading it backwards as "attendance rose → renewed". Side
    note: having the biggest rise in the city doesn't help either, since the policy only cares whether
    attendance rose, not by how much.
  gold: 2
  second: 2
  why: >-
    Criterion 1 met: names the inference from the museum's rise, which the policy requires, to renewal.
    Criterion 2 met: the rise is required but not a guarantee, so the council could refuse for another reason
    (offered as possibilities). The if-then restatement and the remark about the size of the rise are accurate
    extras that neither add nor lose credit.
