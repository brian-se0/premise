- id: fla01
  task: arg-0009.flaw
  holdout: false
  type: partial
  answer: >-
    i think maybe the schools near those 5 branches started some kind of reading challenge or assigned way
    more books that year, which could be why teens there were checking out more
  gold: 1
  second: 1
  why: >-
    Criterion 2 met: a new school reading program near those branches is "something else that changed there at
    the same time", offered as a possibility and not ruled out by the stimulus. Criterion 1 not met: the
    answer never states the director's inference that the longer hours caused the rise.
- id: fla02
  task: arg-0009.flaw
  holdout: false
  type: reference-like
  answer: >-
    The director credits the later closing time for the 30 percent jump in teen borrowing at the five
    branches, but those branches weren't chosen at random: they were the ones where teens had asked most often
    for later hours. Teens there may already have been getting more into the library, so borrowing could have
    climbed even if the hours had stayed the same.
  gold: 2
  second: 2
  why: >-
    Criterion 1 met: names the rise in teen borrowing at the five branches and the conclusion that the later
    hours caused it. Criterion 2 met: offers, as a possibility, a cause the stimulus leaves open (growing teen
    interest at the branches selected for that interest), which the accept text names as one route.
- id: fla03
  task: arg-0011.flaw
  holdout: false
  type: valid-unlike-reference
  answer: >-
    Water through the dry season was necessary for a big settlement, but the argument uses Kessel Ridge's
    spring (and its rich soil) as if that made a big settlement likely. Necessary isn't the same as likely:
    for "probably large" to follow we'd need to know that sites with that kind of water and soil tended to
    grow big rather than stay small, and nothing in the passage tells us that.
  gold: 2
  second: 2
  why: >-
    Criterion 1 met: names the water requirement, that Kessel Ridge had it, and the "probably large"
    conclusion. Criterion 2 met: uses the necessary-condition framing but applies it to the claimed
    likelihood, as the accept text requires, saying nothing shows such sites usually grew large; it does not
    claim water and soil are no evidence.
- id: fla04
  task: arg-0011.flaw
  holdout: false
  type: ambiguous
  answer: >-
    ok so the argument is basically big settlements needed a reliable water source in the dry season, kessel
    ridge had one, so the ruins were probably a big settlement. but a lot of places with springs and good soil
    couldve just stayed small villages, so meeting the water requirement doesnt mean it was big.
  gold: 1
  second: 1
  acceptable: [ 1, 2 ]
  settlement: >-
    Both scorers gave 1 and both name 2 as defensible: "a lot of places with springs and good soil could've
    just stayed small" can be read as the likelihood point, though the answer concludes only that the
    conditions don't guarantee a large settlement.
  why: >-
    Criterion 1 is clearly met. Criterion 2 is borderline: the answer's stated point ("doesnt mean it was
    big") is that the conditions fail to guarantee a large settlement, which the accept text says does not
    earn the point, giving 1; but "a lot of places with springs and good soil couldve just stayed small" can
    be read as the point that nothing shows such sites usually grew large, giving 2. Gold 1 because the answer
    never addresses the "probably". Acceptable {1, 2}.
